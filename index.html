<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="灵感册">
  <meta name="theme-color" content="#ff6b9d">
  <title>我的灵感册</title>
  <script>
  // Generate canvas icon & PWA manifest
  (function() {
    try {
      const c = document.createElement('canvas');
      c.width = c.height = 512;
      const x = c.getContext('2d');
      // Background gradient
      const bg = x.createLinearGradient(0, 0, 512, 512);
      bg.addColorStop(0, '#ff6b9d'); bg.addColorStop(1, '#ffb7d0');
      // Rounded rect clip
      const rr = (ctx, rx, ry, rw, rh, radius) => {
        ctx.beginPath(); ctx.moveTo(rx+radius, ry);
        ctx.lineTo(rx+rw-radius, ry); ctx.arcTo(rx+rw, ry, rx+rw, ry+radius, radius);
        ctx.lineTo(rx+rw, ry+rh-radius); ctx.arcTo(rx+rw, ry+rh, rx+rw-radius, ry+rh, radius);
        ctx.lineTo(rx+radius, ry+rh); ctx.arcTo(rx, ry+rh, rx, ry+rh-radius, radius);
        ctx.lineTo(rx, ry+radius); ctx.arcTo(rx, ry, rx+radius, ry, radius);
        ctx.closePath();
      };
      rr(x, 0, 0, 512, 512, 108); x.fillStyle = bg; x.fill(); x.clip();
      // Card shadow 1
      x.save(); x.translate(256,256); x.rotate(-0.13); x.translate(-256,-256);
      x.fillStyle='rgba(255,255,255,0.2)'; rr(x,121,115,270,290,26); x.fill(); x.restore();
      // Card shadow 2
      x.save(); x.translate(256,256); x.rotate(-0.055); x.translate(-256,-256);
      x.fillStyle='rgba(255,255,255,0.42)'; rr(x,121,115,270,290,26); x.fill(); x.restore();
      // Front card
      x.fillStyle='white'; rr(x,121,115,270,290,26); x.fill();
      // Lines
      [[148,185],[148,218],[148,251],[148,284,148]].forEach(([lx,ly,w])=>{
        x.fillStyle='#ffd6e8'; x.beginPath(); rr(x,lx,ly,w||216,13,6); x.fill();
      });
      // Heart
      x.fillStyle='#ff6b9d'; x.beginPath();
      x.moveTo(256,355); x.bezierCurveTo(256,355,190,318,190,286);
      x.bezierCurveTo(190,265,210,253,232,263);
      x.bezierCurveTo(244,268,252,279,256,290);
      x.bezierCurveTo(260,279,268,268,280,263);
      x.bezierCurveTo(302,253,322,265,322,286);
      x.bezierCurveTo(322,318,256,355,256,355); x.fill();
      // Stars
      const star=(cx,cy,r1,r2,pts=8)=>{
        x.beginPath();
        for(let i=0;i<pts;i++){const a=(i*Math.PI/(pts/2))-Math.PI/2;const r=i%2===0?r1:r2;
          i===0?x.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}
        x.closePath(); x.fill();
      };
      x.fillStyle='rgba(255,255,255,0.95)'; star(405,100,34,14);
      x.fillStyle='rgba(255,255,255,0.7)'; star(448,158,19,8);
      x.fillStyle='rgba(255,255,255,0.5)'; star(380,155,11,5);
      const iconUrl = c.toDataURL('image/png');
      // Apple touch icon
      const il = document.createElement('link'); il.rel='apple-touch-icon'; il.href=iconUrl; document.head.appendChild(il);
      // Manifest
      const m = {name:'我的灵感册',short_name:'灵感册',start_url:'.',display:'standalone',background_color:'#fdf6f9',theme_color:'#ff6b9d',icons:[{src:iconUrl,sizes:'512x512',type:'image/png'}]};
      const ml = document.createElement('link'); ml.rel='manifest'; ml.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/json'})); document.head.appendChild(ml);
    } catch(e) {}
  })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif; background:#fdf6f9; min-height:100vh; overflow-x:hidden; }
    button,textarea,input { font-family:inherit; }
    ::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:#e0d0e0; border-radius:2px; }
    @keyframes fadeIn { from{opacity:0;transform:scale(0.92)} to{opacity:1;transform:scale(1)} }
    @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
    .modal-sheet { animation:slideUp 0.3s cubic-bezier(0.32,0.72,0,1); }
    .random-card { animation:fadeIn 0.4s cubic-bezier(0.34,1.56,0.64,1); }
    .cat-card:active { transform:scale(0.96); } .cat-card { transition:transform 0.12s; }
    .dot-btn { transition:all 0.18s cubic-bezier(0.34,1.56,0.64,1); }
    .img-scroll::-webkit-scrollbar { display:none; }
    .img-scroll { -ms-overflow-style:none; scrollbar-width:none; }
  </style>
</head>
<body>
  <div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const genId = () => `${Date.now()}-${Math.random().toString(36).substr(2,6)}`;
const getYM = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };

// Get images array from a card (handles old single-image and new multi-image)
const getCardImages = (card) => {
  if (!card) return [];
  if (card.images?.length) return card.images;
  if (card.content) return [card.content];
  return [];
};

const PRESET_COLORS = ['#FFB6C1','#FFCCE5','#FFD1DC','#FFDAB9','#FFF3B0','#C9B1FF','#E8DFFF','#C3D9FF','#B4E0FF','#A8E6CF','#D4F1B4','#A0E7D0','#F5DEB3','#E6E6FA','#FAEBD7'];

const ICONS = [
  '💄','💋','💅','🧴','🧼','🪥','🪞','💊','🌿',
  '💍','👗','👠','👜','🧣','🧤','🧦','👒','🎩','🧢','👑','🪬','📿','🌂','🕶️','⌚','🧳','👛','🛍️',
  '🌸','🌺','🌷','🌹','🪷','🌼','🌻','🍀','🍃','🕯️','🫧','🌙','⭐','✨','🌈','🦋',
  '🍓','🍰','🧁','🫖','🍵','🧋','🥂','🍷','🍣','🥗',
  '📚','🎨','🎀','🧸','💎','🪩','🎵','🎬','✏️','📷','🪴','🐱','🐰','🍄','💌','🗓️','🔖','🧩','🎲',
];

const DEFAULT_CATEGORIES = [
  {id:'c1',name:'美妆',icon:'💄',color:'#FFB6C1',cards:[]},
  {id:'c2',name:'饰品',icon:'💍',color:'#C9B1FF',cards:[]},
  {id:'c3',name:'香包',icon:'🌸',color:'#FFD1DC',cards:[]},
  {id:'c4',name:'护肤品',icon:'🧴',color:'#A8E6CF',cards:[]},
  {id:'c5',name:'穿搭',icon:'👗',color:'#C3D9FF',cards:[]},
  {id:'c6',name:'美甲',icon:'💅',color:'#FFCCE5',cards:[]},
  {id:'c7',name:'发型',icon:'✂️',color:'#FFE4B5',cards:[]},
  {id:'c8',name:'包包',icon:'👜',color:'#D4F1B4',cards:[]},
  {id:'c9',name:'鞋履',icon:'👠',color:'#B4E0FF',cards:[]},
  {id:'c10',name:'香水',icon:'🌺',color:'#FFD6B0',cards:[]},
  {id:'c11',name:'好物推荐',icon:'⭐',color:'#FFF3B0',cards:[]},
  {id:'c12',name:'灵感收藏',icon:'✨',color:'#E8DFFF',cards:[]},
];

// ─── IndexedDB persistence (no size limit, safe for images) ──────────────
const IDB = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('ibook_db', 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore('kv');
      req.onsuccess = e => { this._db = e.target.result; resolve(this._db); };
      req.onerror = e => reject(e.target.error);
    });
  },
  async get(key) {
    const db = await this.open();
    return new Promise((resolve) => {
      const req = db.transaction('kv','readonly').objectStore('kv').get(key);
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = () => resolve(null);
    });
  },
  async set(key, value) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('kv','readwrite');
      tx.objectStore('kv').put(value, key);
      tx.oncomplete = resolve;
      tx.onerror = reject;
    });
  },
};

function App() {
  const [categories, setCategories] = useState(DEFAULT_CATEGORIES.map(c=>({...c})));
  const [dbLoaded, setDbLoaded] = useState(false);
  const [screen, setScreen] = useState('home');
  const [catId, setCatId] = useState(null);
  const [cardIdx, setCardIdx] = useState(0);
  const [modal, setModal] = useState(null);
  const [addType, setAddType] = useState('text');
  const [addImageMode, setAddImageMode] = useState('separate'); // separate | combined
  const [addText, setAddText] = useState('');
  const [addCaption, setAddCaption] = useState('');
  const [addImages, setAddImages] = useState([]); // array of base64
  const [randomCard, setRandomCard] = useState(null);
  const [imgViewer, setImgViewer] = useState(null); // { images:[], index:0, caption:'' }
  const [newCatName, setNewCatName] = useState('');
  const [newCatIcon, setNewCatIcon] = useState('🌟');
  const [newCatColor, setNewCatColor] = useState('#FFB6C1');
  const [toast, setToast] = useState(null);

  const fileInputRef = useRef();
  const importRef = useRef();
  const touchStartX = useRef(null);
  const toastTimer = useRef(null);

  // Load from IndexedDB on first mount
  useEffect(() => {
    IDB.get('categories').then(saved => {
      if (saved && Array.isArray(saved)) setCategories(saved);
      setDbLoaded(true);
    }).catch(() => setDbLoaded(true));
  }, []);

  // Save to IndexedDB whenever categories change (but only after initial load)
  useEffect(() => {
    if (!dbLoaded) return;
    IDB.set('categories', categories).catch(e => console.warn('Save failed', e));
  }, [categories, dbLoaded]);

  const cat = categories.find(c => c.id === catId);
  const cards = cat?.cards || [];
  const card = cards[cardIdx];
  const ym = getYM();

  const showToast = useCallback((msg) => {
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setToast(msg); toastTimer.current = setTimeout(() => setToast(null), 2200);
  }, []);

  const openCategory = (id) => { setCatId(id); setCardIdx(0); setScreen('category'); };
  const openCard = (idx) => { setCardIdx(idx); setScreen('card'); };
  const nextCard = () => setCardIdx(i => Math.min(i+1, cards.length-1));
  const prevCard = () => setCardIdx(i => Math.max(i-1, 0));
  const resetAddCard = () => { setAddText(''); setAddCaption(''); setAddImages([]); };

  const updateCard = useCallback((targetCatId, cardId, updater) => {
    setCategories(cats => cats.map(c =>
      c.id!==targetCatId ? c : {...c, cards: c.cards.map(cd => cd.id!==cardId ? cd : updater(cd))}
    ));
  }, []);

  const toggleTried = (cardId) => updateCard(catId, cardId, cd => ({...cd, tried: !cd.tried}));
  const setMonthlyCount = (cardId, count) => updateCard(catId, cardId, cd => ({
    ...cd, monthlyUsage: {...(cd.monthlyUsage||{}), [ym]: Math.max(0, Math.min(3, count))}
  }));
  const getMonthCount = (cd) => cd?.monthlyUsage?.[ym] ?? 0;

  const submitAddCard = () => {
    if (addType==='text') {
      if (!addText.trim()) { showToast('请输入文字内容'); return; }
      const nc = {id:genId(),type:'text',content:addText.trim(),caption:'',images:[],createdAt:new Date().toISOString(),tried:false,monthlyUsage:{}};
      setCategories(cats => cats.map(c => c.id===catId ? {...c,cards:[...c.cards,nc]} : c));
      resetAddCard(); setModal(null); showToast('卡片已添加 ✨');
    } else {
      if (!addImages.length) { showToast('请选择图片'); return; }
      if (addImageMode==='separate') {
        const newCards = addImages.map(img => ({id:genId(),type:'image',images:[img],content:'',caption:addCaption.trim(),createdAt:new Date().toISOString(),tried:false,monthlyUsage:{}}));
        setCategories(cats => cats.map(c => c.id===catId ? {...c,cards:[...c.cards,...newCards]} : c));
        resetAddCard(); setModal(null); showToast(`已添加 ${newCards.length} 张卡片 ✨`);
      } else {
        const nc = {id:genId(),type:'image',images:addImages,content:'',caption:addCaption.trim(),createdAt:new Date().toISOString(),tried:false,monthlyUsage:{}};
        setCategories(cats => cats.map(c => c.id===catId ? {...c,cards:[...c.cards,nc]} : c));
        resetAddCard(); setModal(null); showToast('卡片已添加 ✨');
      }
    }
  };

  const deleteCard = () => {
    setCategories(cats => cats.map(c => c.id===catId ? {...c,cards:c.cards.filter((_,i)=>i!==cardIdx)} : c));
    const newLen = cards.length-1;
    if (newLen===0) setScreen('category'); else setCardIdx(i => Math.min(i, newLen-1));
    setModal(null); showToast('已删除');
  };

  const deleteCategory = () => {
    setCategories(cats => cats.filter(c => c.id!==catId));
    setScreen('home'); setModal(null); showToast('分类已删除');
  };

  const submitAddCategory = () => {
    if (!newCatName.trim()) { showToast('请输入分类名称'); return; }
    setCategories(cats => [...cats, {id:genId(),name:newCatName.trim(),icon:newCatIcon,color:newCatColor,cards:[]}]);
    setNewCatName(''); setNewCatIcon('🌟'); setNewCatColor('#FFB6C1');
    setModal(null); showToast('分类已创建 🎉');
  };

  const showRandom = () => {
    if (!cards.length) { showToast('还没有卡片哦，先添加一张吧'); return; }
    const idx = Math.floor(Math.random()*cards.length);
    setRandomCard({card:cards[idx],index:idx}); setModal('random');
  };

  const anotherRandom = () => {
    if (cards.length<=1) { showToast('只有一张卡片哦'); return; }
    let idx, tries=0;
    do { idx=Math.floor(Math.random()*cards.length); tries++; } while(idx===randomCard?.index && tries<10);
    setRandomCard({card:cards[idx],index:idx});
  };

  // Compress image to max 1200px wide, JPEG 82% — reduces a 8MB phone photo to ~150KB
  const compressImage = (dataUrl) => new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1200;
      let w = img.width, h = img.height;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => resolve(dataUrl); // fallback: use original
    img.src = dataUrl;
  });

  const handleImageUploads = (e) => {
    const files = Array.from(e.target.files||[]);
    if (!files.length) return;
    showToast('处理图片中…');
    Promise.all(files.map(f => new Promise(res => {
      const r = new FileReader();
      r.onload = ev => compressImage(ev.target.result).then(res);
      r.readAsDataURL(f);
    }))).then(results => {
      setAddImages(prev => [...prev, ...results]);
      setToast(null);
    });
    e.target.value='';
  };

  const removeAddImage = (idx) => setAddImages(prev => prev.filter((_,i) => i!==idx));

  const exportData = () => {
    const blob = new Blob([JSON.stringify({categories},null,2)],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=`灵感册备份_${new Date().toLocaleDateString('zh-CN').replace(/\//g,'-')}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    showToast('导出成功 📤');
  };

  const handleImport = (e) => {
    const file = e.target.files[0]; if(!file) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const imp = JSON.parse(ev.target.result);
        if (imp.categories && Array.isArray(imp.categories)) {
          setCategories(imp.categories); setScreen('home');
          showToast(`导入成功！共 ${imp.categories.length} 个分类 🎉`);
        } else showToast('文件格式不对');
      } catch(e) { showToast('导入失败，请检查文件'); }
    };
    r.readAsText(file); e.target.value='';
  };

  const handleTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
  const handleTouchEnd = (e) => {
    if (touchStartX.current===null) return;
    const dx = e.changedTouches[0].clientX - touchStartX.current;
    if (Math.abs(dx)>50) { dx<0 ? nextCard() : prevCard(); }
    touchStartX.current=null;
  };

  // ─── Image Viewer (multi-image, pinch-to-zoom) ───────────────────────────
  function ImageViewer({ images, initialIndex=0, caption, onClose }) {
    const [idx, setIdx] = useState(initialIndex);
    const [scale, setScale] = useState(1);
    const [offset, setOffset] = useState({x:0,y:0});
    const lastDist = useRef(null);
    const startOff = useRef(null);
    const lastTap = useRef(0);
    const swipeStartX = useRef(null);

    const reset = () => { setScale(1); setOffset({x:0,y:0}); };

    const onTouchStart = (e) => {
      if (e.touches.length===2) {
        const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
        lastDist.current = Math.sqrt(dx*dx+dy*dy);
      } else if (e.touches.length===1) {
        startOff.current = {x:e.touches[0].clientX-offset.x, y:e.touches[0].clientY-offset.y};
        swipeStartX.current = e.touches[0].clientX;
        const now=Date.now();
        if (now-lastTap.current<280) { setScale(s => { const ns=s>1.5?1:2.5; if(ns===1) setOffset({x:0,y:0}); return ns; }); }
        lastTap.current = now;
      }
    };
    const onTouchMove = (e) => {
      e.preventDefault();
      if (e.touches.length===2) {
        const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if (lastDist.current) setScale(s => Math.max(1, Math.min(6, s*(dist/lastDist.current))));
        lastDist.current=dist;
      } else if (e.touches.length===1 && scale>1 && startOff.current) {
        setOffset({x:e.touches[0].clientX-startOff.current.x, y:e.touches[0].clientY-startOff.current.y});
      }
    };
    const onTouchEnd = (e) => {
      lastDist.current=null;
      if (scale<=1 && swipeStartX.current!==null) {
        const dx = (e.changedTouches[0]?.clientX||swipeStartX.current) - swipeStartX.current;
        if (Math.abs(dx)>60) {
          if (dx<0 && idx<images.length-1) { setIdx(i=>i+1); reset(); }
          else if (dx>0 && idx>0) { setIdx(i=>i-1); reset(); }
        }
      }
      if (scale<=1) setOffset({x:0,y:0});
      swipeStartX.current=null;
    };

    return (
      <div style={{position:'fixed',inset:0,background:'#000',zIndex:300,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden'}}
        onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}>
        <img src={images[idx]} alt="" style={{maxWidth:'100vw',maxHeight:'100vh',objectFit:'contain',transform:`scale(${scale}) translate(${offset.x/scale}px,${offset.y/scale}px)`,transformOrigin:'center',touchAction:'none',userSelect:'none',display:'block',transition:scale===1?'transform 0.2s':'none'}} />
        <button onClick={onClose} style={{position:'absolute',top:54,right:16,background:'rgba(255,255,255,0.2)',border:'none',borderRadius:'50%',width:38,height:38,color:'#fff',fontSize:18,cursor:'pointer',backdropFilter:'blur(6px)',display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
        {images.length>1 && (
          <>
            {idx>0 && <button onClick={()=>{setIdx(i=>i-1);reset();}} style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',background:'rgba(255,255,255,0.2)',border:'none',borderRadius:'50%',width:40,height:40,color:'#fff',fontSize:22,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>‹</button>}
            {idx<images.length-1 && <button onClick={()=>{setIdx(i=>i+1);reset();}} style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',background:'rgba(255,255,255,0.2)',border:'none',borderRadius:'50%',width:40,height:40,color:'#fff',fontSize:22,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>›</button>}
            <div style={{position:'absolute',bottom:72,left:0,right:0,display:'flex',justifyContent:'center',gap:6}}>
              {images.map((_,i)=><div key={i} style={{width:i===idx?16:8,height:8,borderRadius:4,background:i===idx?'#fff':'rgba(255,255,255,0.4)',transition:'all 0.2s'}} />)}
            </div>
          </>
        )}
        {caption && scale<=1.2 && <div style={{position:'absolute',bottom:48,left:0,right:0,textAlign:'center',color:'rgba(255,255,255,0.85)',fontSize:14,padding:'0 24px',textShadow:'0 1px 4px rgba(0,0,0,0.5)'}}>{caption}</div>}
        <div style={{position:'absolute',bottom:20,left:0,right:0,textAlign:'center',color:'rgba(255,255,255,0.35)',fontSize:11}}>{images.length>1?`${idx+1}/${images.length}  ·  `:''}{scale>1?'拖动移动  ·  双击还原':'双击或双指缩放'}</div>
      </div>
    );
  }

  // ─── Tracker Bar ─────────────────────────────────────────────────────────
  function TrackerBar({ cd, onToggleTried, onSetMonthly }) {
    if (!cd) return null;
    const mc = getMonthCount(cd);
    return (
      <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
        <button onClick={onToggleTried} style={{display:'flex',alignItems:'center',gap:7,background:cd.tried?'#fff0f4':'#f5f0f5',border:'1.5px solid',borderColor:cd.tried?'#ffb8c4':'#e8dce8',borderRadius:20,padding:'7px 14px',cursor:'pointer'}}>
          <div className="dot-btn" style={{width:13,height:13,borderRadius:'50%',background:cd.tried?'#ff9a9e':'transparent',border:'2px solid',borderColor:cd.tried?'#ff9a9e':'#c8b8c8'}} />
          <span style={{fontSize:12.5,color:cd.tried?'#e07080':'#b8a8b8',fontWeight:600}}>{cd.tried?'已尝试 ✓':'未尝试'}</span>
        </button>
        <div style={{display:'flex',alignItems:'center',gap:6,background:'#f0f4ff',border:'1.5px solid #d0dcff',borderRadius:20,padding:'7px 14px'}}>
          <span style={{fontSize:12,color:'#8090c0',fontWeight:600}}>本月</span>
          <div style={{display:'flex',gap:5}}>
            {[1,2,3].map(n=>(
              <button key={n} className="dot-btn" onClick={()=>onSetMonthly(mc===n?n-1:n)} style={{width:16,height:16,borderRadius:'50%',border:'2px solid',borderColor:mc>=n?'#7ab0ff':'#c8d4ff',background:mc>=n?'#7ab0ff':'transparent',cursor:'pointer',padding:0}} />
            ))}
          </div>
          <span style={{fontSize:11,color:'#a0b0d8',minWidth:20}}>{mc}/3</span>
        </div>
      </div>
    );
  }

  // ─── Multi-image gallery (horizontal scroll) ──────────────────────────────
  function ImageGallery({ images, caption, onImageClick }) {
    if (!images.length) return null;
    if (images.length===1) return (
      <div onClick={()=>onImageClick(0)} style={{cursor:'zoom-in',position:'relative'}}>
        <img src={images[0]} alt={caption} style={{width:'100%',maxHeight:380,objectFit:'contain',display:'block'}} />
        <div style={{position:'absolute',bottom:8,right:10,background:'rgba(0,0,0,0.35)',borderRadius:10,padding:'2px 8px',fontSize:11,color:'#fff'}}>🔍 点击放大</div>
      </div>
    );
    return (
      <div>
        <div className="img-scroll" style={{display:'flex',overflowX:'auto',gap:4,scrollSnapType:'x mandatory'}}>
          {images.map((img,i)=>(
            <div key={i} onClick={()=>onImageClick(i)} style={{flexShrink:0,width:'85%',scrollSnapAlign:'center',cursor:'zoom-in',position:'relative'}}>
              <img src={img} alt="" style={{width:'100%',maxHeight:320,objectFit:'contain',display:'block',background:'#f8f8f8'}} />
              <div style={{position:'absolute',bottom:6,right:8,background:'rgba(0,0,0,0.4)',borderRadius:8,padding:'2px 7px',fontSize:11,color:'#fff'}}>{i+1}/{images.length}</div>

        </div>
        <div style={{display:'flex',justifyContent:'center',gap:5,padding:'8px 0 2px'}}>
          {images.map((_,i)=><div key={i} style={{width:7,height:7,borderRadius:'50%',background:'#e0d0e8'}} />)}

              {addImages.length>0 && (
                <div style={{textAlign:'center',fontSize:12,color:'#a090c0',marginBottom:10}}>
                  已选 {addImages.length} 张图片 · {addImageMode==='separate'?`将生成 ${addImages.length} 张卡片`:'合并为 1 张卡片'}
                </div>
              )}

              <input value={addCaption} onChange={e=>setAddCaption(e.target.value)}
                placeholder="添加描述（可选）" style={S.input} />
            </div>
          )}

          <div style={{display:'flex',gap:10,marginTop:18}}>
            <button onClick={()=>{setModal(null);resetAddCard();}} style={S.pill(false)}>取消</button>
            <button onClick={submitAddCard} style={S.pill(true)}>保存卡片</button>
          </div>
        </div>
      </div>
    );
  }

  // ─── Add Category Modal ───────────────────────────────────────────────────
  function AddCategoryModal() {
    return (
      <div style={S.overlay} onClick={e=>{if(e.target===e.currentTarget)setModal(null);}}>
        <div className="modal-sheet" style={{...S.sheet,maxHeight:'92vh'}}>
          <div style={S.handle}></div>
          <h3 style={{textAlign:'center',marginBottom:20,fontSize:17,fontWeight:700,color:'#2a2a2a'}}>新建分类</h3>
          <div style={{marginBottom:16}}>
            <div style={S.label}>分类名称</div>
            <input value={newCatName} onChange={e=>setNewCatName(e.target.value)} placeholder="例如：香包、美妆..." maxLength={10} style={S.input} />
          </div>
          <div style={{marginBottom:16}}>
            <div style={S.label}>选择图标</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:8,maxHeight:200,overflowY:'auto',paddingRight:4}}>
              {ICONS.map(icon=>(
                <button key={icon} onClick={()=>setNewCatIcon(icon)}
                  style={{width:44,height:44,border:newCatIcon===icon?'2.5px solid #ff9a9e':'1.5px solid #f0e8f0',borderRadius:12,background:newCatIcon===icon?'#fff0f4':'#fdf6f9',fontSize:22,cursor:'pointer',flexShrink:0}}>
                  {icon}
                </button>
              ))}
            </div>
          </div>
          <div style={{marginBottom:20}}>
            <div style={S.label}>选择颜色</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:10}}>
              {PRESET_COLORS.map(color=>(
                <button key={color} onClick={()=>setNewCatColor(color)}
                  style={{width:34,height:34,borderRadius:'50%',background:color,border:newCatColor===color?'3px solid #555':'2.5px solid transparent',cursor:'pointer'}} />
              ))}
            </div>
          </div>
          <div style={{background:newCatColor,borderRadius:14,padding:'14px 16px',marginBottom:20,display:'flex',alignItems:'center',gap:12}}>
            <span style={{fontSize:28}}>{newCatIcon}</span>
            <span style={{fontWeight:600,fontSize:16,color:'#2a2a2a'}}>{newCatName||'分类名称'}</span>
          </div>
          <div style={{display:'flex',gap:10}}>
            <button onClick={()=>setModal(null)} style={S.pill(false)}>取消</button>
            <button onClick={submitAddCategory} style={S.pill(true)}>创建</button>
          </div>
        </div>
      </div>
    );
  }

  // ─── Random Modal ─────────────────────────────────────────────────────────
  function RandomModal() {
    const rc = randomCard?.card;
    const imgs = getCardImages(rc);
    return (
      <div style={{position:'fixed',inset:0,background:'rgba(20,0,10,0.7)',zIndex:100,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:24,backdropFilter:'blur(4px)'}}>
        <div className="random-card" style={{background:'#fff',borderRadius:24,width:'100%',maxWidth:380,overflow:'hidden',boxShadow:'0 12px 48px rgba(0,0,0,0.25)'}}>
          <div style={{background:'linear-gradient(135deg,#ff9a9e,#fecfef)',padding:'14px 18px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{color:'#fff',fontWeight:700,fontSize:15}}>🎲 随机卡片</span>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <span style={{color:'rgba(255,255,255,0.8)',fontSize:12}}>{(randomCard?.index??0)+1} / {cards.length}</span>
              <button onClick={()=>setModal(null)} style={{background:'rgba(255,255,255,0.3)',border:'none',borderRadius:'50%',width:28,height:28,color:'#fff',cursor:'pointer',fontSize:14,display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
            </div>
          </div>
          {imgs.length>0 ? (
            <div>
              <ImageGallery images={imgs} caption={rc?.caption} onImageClick={(i)=>setImgViewer({images:imgs,index:i,caption:rc?.caption})} />
              {rc?.caption && <div style={{padding:'12px 18px 8px',fontSize:14,color:'#555',borderTop:'1px solid #f5eff5',lineHeight:1.6}}>{rc.caption}</div>}
            </div>
          ) : (
            <div style={{padding:'24px 22px 12px',minHeight:120,display:'flex',alignItems:'center'}}>
              <div style={{fontSize:15,color:'#2a2a2a',lineHeight:1.85,whiteSpace:'pre-wrap'}}>{rc?.content}</div>
            </div>
          )}
          <div style={{padding:'10px 16px 14px',borderTop:'1px solid #f5eff5'}}>
            <TrackerBar cd={rc}
              onToggleTried={()=>{toggleTried(rc.id); setRandomCard(r=>({...r,card:{...r.card,tried:!r.card.tried}}));}}
              onSetMonthly={(n)=>{setMonthlyCount(rc.id,n); const nu={...(rc?.monthlyUsage||{}),[ym]:n}; setRandomCard(r=>({...r,card:{...r.card,monthlyUsage:nu}}));}} />
          </div>
          <div style={{padding:'0 16px 18px',display:'flex',gap:10}}>
            <button onClick={anotherRandom} style={S.pill(false)}>再来一张 ✨</button>
            <button onClick={()=>{openCard(randomCard.index);setModal(null);}} style={S.pill(true)}>查看详情</button>
          </div>
        </div>
      </div>
    );
  }

  // ─── Confirm Modal ────────────────────────────────────────────────────────
  function ConfirmModal({title,body,onConfirm,onCancel}) {
    return (
      <div style={{position:'fixed',inset:0,background:'rgba(20,0,10,0.55)',zIndex:100,display:'flex',alignItems:'center',justifyContent:'center',padding:24,backdropFilter:'blur(2px)'}}>
        <div style={{background:'#fff',borderRadius:22,padding:'26px 22px 20px',width:'100%',maxWidth:320,boxShadow:'0 8px 32px rgba(0,0,0,0.15)'}}>
          <div style={{textAlign:'center',fontSize:16,fontWeight:600,marginBottom:8,color:'#2a2a2a'}}>{title}</div>
          {body&&<div style={{textAlign:'center',fontSize:13,color:'#b8a8b8',marginBottom:20,lineHeight:1.6}}>{body}</div>}
          {!body&&<div style={{marginBottom:20}}></div>}
          <div style={{display:'flex',gap:10}}>
            <button onClick={onCancel} style={S.pill(false)}>取消</button>
            <button onClick={onConfirm} style={{...S.pill(true),background:'linear-gradient(135deg,#ff6b6b,#ff9e9e)'}}>确认删除</button>
          </div>
        </div>
      </div>
    );
  }

  // ─── Root Render ──────────────────────────────────────────────────────────
  if (!dbLoaded) return (
    <div style={{...S.page,display:'flex',alignItems:'center',justifyContent:'center',height:'100vh'}}>
      <div style={{textAlign:'center',color:'#e0a0b0'}}>
        <div style={{fontSize:40,marginBottom:12}}>📖</div>
        <div style={{fontSize:14}}>加载中…</div>
      </div>
    </div>
  );

  return (
    <div style={S.page}>
      {screen==='home'     && <HomeScreen />}
      {screen==='category' && <CategoryScreen />}
      {screen==='card'     && <CardScreen />}
      {screen==='settings' && <SettingsScreen />}

      {modal==='addCard'    && <AddCardModal />}
      {modal==='addCat'     && <AddCategoryModal />}
      {modal==='random'     && <RandomModal />}
      {modal==='deleteCard' && <ConfirmModal title="删除这张卡片？" onConfirm={deleteCard} onCancel={()=>setModal(null)} />}
      {modal==='deleteCat'  && <ConfirmModal title={`删除"${cat?.name}"？`} body="该分类下所有卡片也会一并删除，无法恢复。" onConfirm={deleteCategory} onCancel={()=>setModal(null)} />}

      {imgViewer && <ImageViewer images={imgViewer.images} initialIndex={imgViewer.index} caption={imgViewer.caption} onClose={()=>setImgViewer(null)} />}

      {toast && (
        <div style={{position:'fixed',bottom:88,left:'50%',transform:'translateX(-50%)',background:'rgba(42,20,42,0.82)',color:'#fff',padding:'9px 22px',borderRadius:22,fontSize:14,zIndex:9999,whiteSpace:'nowrap',backdropFilter:'blur(4px)'}}>
          {toast}
        </div>
      )}

      <input ref={fileInputRef} type="file" accept="image/*" multiple style={{display:'none'}} onChange={handleImageUploads} />
      <input ref={importRef} type="file" accept=".json" style={{display:'none'}} onChange={handleImport} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
