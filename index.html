<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="灵感册">
  <meta name="theme-color" content="#ff9a9e">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='url(%23g)'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff9a9e'/%3E%3Cstop offset='1' stop-color='%23fecfef'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ctext x='90' y='125' font-size='95' text-anchor='middle'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
  <title>我的灵感册</title>
  <script>
    // PWA manifest (inline)
    const manifest = {
      name: '我的灵感册', short_name: '灵感册',
      start_url: '.', display: 'standalone',
      background_color: '#fdf6f9', theme_color: '#ff9a9e',
      icons: [{ src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='url(%23g)'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff9a9e'/%3E%3Cstop offset='1' stop-color='%23fecfef'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ctext x='90' y='125' font-size='95' text-anchor='middle'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E", sizes: '180x180', type: 'image/svg+xml' }]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
    document.querySelector ? (() => {
      const link = document.createElement('link');
      link.rel = 'manifest'; link.href = URL.createObjectURL(blob);
      document.head.appendChild(link);
    })() : null;
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
      background: #fdf6f9;
      min-height: 100vh;
      overflow-x: hidden;
    }
    button { font-family: inherit; }
    textarea, input { font-family: inherit; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #e0d0e0; border-radius: 2px; }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-sheet { animation: slideUp 0.3s cubic-bezier(0.32, 0.72, 0, 1); }
    .random-card { animation: fadeIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .cat-card:active { transform: scale(0.96); }
    .cat-card { transition: transform 0.12s; }
    .dot-btn { transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1); }
  </style>
</head>
<body>
  <div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const genId = () => `${Date.now()}-${Math.random().toString(36).substr(2,6)}`;
const getYM = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };

const PRESET_COLORS = [
  '#FFB6C1','#FFCCE5','#FFD1DC','#FFDAB9','#FFF3B0',
  '#C9B1FF','#E8DFFF','#C3D9FF','#B4E0FF','#A8E6CF',
  '#D4F1B4','#A0E7D0','#F5DEB3','#E6E6FA','#FAEBD7',
];

const ICONS = [
  // 美妆 & 护肤
  '💄','💋','💅','🧴','🧼','🪥','🪞','💊','🌿',
  // 配饰 & 穿搭
  '💍','👗','👠','👜','🧣','🧤','🧦','👒','🎩','🧢','👑','🪬','📿','🌂','🕶️','⌚','🧳','👛','🛍️',
  // 香氛 & 生活
  '🌸','🌺','🌷','🌹','🪷','🌼','🌻','🍀','🌿','🍃','🕯️','🫧','🌙','⭐','✨','🌈','🦋',
  // 美食 & 饮品
  '🍓','🍰','🧁','🫖','🍵','🧋','🥂','🍷','🍣','🥗',
  // 其他好物
  '📚','🎨','🎀','🧸','💎','🪩','🎵','🎬','✏️','📷','🪴','🐱','🐰','🍄','💌','🗓️','🔖','🧩','🎲',
];

const DEFAULT_CATEGORIES = [
  { id:'c1',  name:'美妆',    icon:'💄', color:'#FFB6C1', cards:[] },
  { id:'c2',  name:'饰品',    icon:'💍', color:'#C9B1FF', cards:[] },
  { id:'c3',  name:'香包',    icon:'🌸', color:'#FFD1DC', cards:[] },
  { id:'c4',  name:'护肤品',  icon:'🧴', color:'#A8E6CF', cards:[] },
  { id:'c5',  name:'穿搭',    icon:'👗', color:'#C3D9FF', cards:[] },
  { id:'c6',  name:'美甲',    icon:'💅', color:'#FFCCE5', cards:[] },
  { id:'c7',  name:'发型',    icon:'✂️', color:'#FFE4B5', cards:[] },
  { id:'c8',  name:'包包',    icon:'👜', color:'#D4F1B4', cards:[] },
  { id:'c9',  name:'鞋履',    icon:'👠', color:'#B4E0FF', cards:[] },
  { id:'c10', name:'香水',    icon:'🌺', color:'#FFD6B0', cards:[] },
  { id:'c11', name:'好物推荐',icon:'⭐', color:'#FFF3B0', cards:[] },
  { id:'c12', name:'灵感收藏',icon:'✨', color:'#E8DFFF', cards:[] },
];

function loadData() {
  try {
    const s = localStorage.getItem('_ibook_v3');
    if (s) return JSON.parse(s);
  } catch(e) {}
  return { categories: DEFAULT_CATEGORIES.map(c => ({...c})) };
}

function App() {
  const [categories, setCategories] = useState(() => loadData().categories);
  const [screen, setScreen] = useState('home');
  const [catId, setCatId] = useState(null);
  const [cardIdx, setCardIdx] = useState(0);
  const [modal, setModal] = useState(null);
  const [addType, setAddType] = useState('text');
  const [addText, setAddText] = useState('');
  const [addCaption, setAddCaption] = useState('');
  const [addImageData, setAddImageData] = useState(null);
  const [randomCard, setRandomCard] = useState(null);
  const [imgViewer, setImgViewer] = useState(null); // { src, caption }
  const [newCatName, setNewCatName] = useState('');
  const [newCatIcon, setNewCatIcon] = useState('🌟');
  const [newCatColor, setNewCatColor] = useState('#FFB6C1');
  const [toast, setToast] = useState(null);

  const fileInputRef = useRef();
  const importRef = useRef();
  const touchStartX = useRef(null);
  const toastTimer = useRef(null);

  useEffect(() => {
    try { localStorage.setItem('_ibook_v3', JSON.stringify({ categories })); } catch(e) {}
  }, [categories]);

  const cat = categories.find(c => c.id === catId);
  const cards = cat?.cards || [];
  const card = cards[cardIdx];
  const ym = getYM();

  const showToast = useCallback((msg) => {
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setToast(msg);
    toastTimer.current = setTimeout(() => setToast(null), 2200);
  }, []);

  const openCategory = (id) => { setCatId(id); setCardIdx(0); setScreen('category'); };
  const openCard = (idx) => { setCardIdx(idx); setScreen('card'); };
  const nextCard = () => setCardIdx(i => Math.min(i + 1, cards.length - 1));
  const prevCard = () => setCardIdx(i => Math.max(i - 1, 0));
  const resetAddCard = () => { setAddText(''); setAddCaption(''); setAddImageData(null); };

  // ─── Card tracker helpers ──────────────────────────────────────────────────
  const updateCard = useCallback((targetCatId, cardId, updater) => {
    setCategories(cats => cats.map(c =>
      c.id !== targetCatId ? c : { ...c, cards: c.cards.map(cd => cd.id !== cardId ? cd : updater(cd)) }
    ));
  }, []);

  const toggleTried = (cardId) => {
    updateCard(catId, cardId, cd => ({ ...cd, tried: !cd.tried }));
  };

  const setMonthlyCount = (cardId, count) => {
    updateCard(catId, cardId, cd => ({
      ...cd,
      monthlyUsage: { ...(cd.monthlyUsage || {}), [ym]: Math.max(0, Math.min(3, count)) }
    }));
  };

  const getMonthCount = (cd) => cd?.monthlyUsage?.[ym] ?? 0;

  // ─── Card CRUD ────────────────────────────────────────────────────────────
  const submitAddCard = () => {
    if (addType === 'text' && !addText.trim()) { showToast('请输入文字内容'); return; }
    if (addType === 'image' && !addImageData) { showToast('请选择图片'); return; }
    const newCard = {
      id: genId(), type: addType,
      content: addType === 'text' ? addText.trim() : addImageData,
      caption: addType === 'image' ? addCaption.trim() : '',
      createdAt: new Date().toISOString(),
      tried: false,
      monthlyUsage: {},
    };
    setCategories(cats => cats.map(c => c.id === catId ? {...c, cards:[...c.cards, newCard]} : c));
    resetAddCard(); setModal(null); showToast('卡片已添加 ✨');
  };

  const deleteCard = () => {
    setCategories(cats => cats.map(c =>
      c.id === catId ? {...c, cards: c.cards.filter((_,i) => i !== cardIdx)} : c
    ));
    const newLen = cards.length - 1;
    if (newLen === 0) setScreen('category');
    else setCardIdx(i => Math.min(i, newLen - 1));
    setModal(null); showToast('已删除');
  };

  const deleteCategory = () => {
    setCategories(cats => cats.filter(c => c.id !== catId));
    setScreen('home'); setModal(null); showToast('分类已删除');
  };

  const submitAddCategory = () => {
    if (!newCatName.trim()) { showToast('请输入分类名称'); return; }
    const newCat = { id: genId(), name: newCatName.trim(), icon: newCatIcon, color: newCatColor, cards: [] };
    setCategories(cats => [...cats, newCat]);
    setNewCatName(''); setNewCatIcon('🌟'); setNewCatColor('#FFB6C1');
    setModal(null); showToast('分类已创建 🎉');
  };

  const showRandom = () => {
    if (!cards.length) { showToast('还没有卡片哦，先添加一张吧'); return; }
    const idx = Math.floor(Math.random() * cards.length);
    setRandomCard({ card: cards[idx], index: idx });
    setModal('random');
  };

  const anotherRandom = () => {
    if (cards.length <= 1) { showToast('只有一张卡片哦'); return; }
    let idx, tries = 0;
    do { idx = Math.floor(Math.random() * cards.length); tries++; }
    while (idx === randomCard?.index && tries < 10);
    setRandomCard({ card: cards[idx], index: idx });
  };

  const handleImageUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) { showToast('图片不能超过 10MB'); return; }
    const reader = new FileReader();
    reader.onload = (ev) => setAddImageData(ev.target.result);
    reader.readAsDataURL(file);
    e.target.value = '';
  };

  const exportData = () => {
    const blob = new Blob([JSON.stringify({ categories }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `灵感册备份_${new Date().toLocaleDateString('zh-CN').replace(/\//g,'-')}.json`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
    showToast('导出成功 📤');
  };

  const handleImport = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (imported.categories && Array.isArray(imported.categories)) {
          setCategories(imported.categories);
          setScreen('home');
          showToast(`导入成功！共 ${imported.categories.length} 个分类 🎉`);
        } else { showToast('文件格式不对'); }
      } catch(e) { showToast('导入失败，请检查文件'); }
    };
    reader.readAsText(file); e.target.value = '';
  };

  const handleTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
  const handleTouchEnd = (e) => {
    if (touchStartX.current === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX.current;
    if (Math.abs(dx) > 50) { dx < 0 ? nextCard() : prevCard(); }
    touchStartX.current = null;
  };

  // ─── Tracker indicator component ──────────────────────────────────────────
  function TrackerBar({ cd, onToggleTried, onSetMonthly, compact }) {
    if (!cd) return null;
    const mc = getMonthCount(cd);
    if (compact) {
      // Small dots for thumbnails
      return (
        <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
          <div style={{ width: 8, height: 8, borderRadius: '50%', background: cd.tried ? '#ff9a9e' : 'rgba(255,255,255,0.4)', border: '1.5px solid', borderColor: cd.tried ? '#ff9a9e' : 'rgba(255,255,255,0.6)' }} />
          <div style={{ display: 'flex', gap: 2 }}>
            {[1,2,3].map(n => (
              <div key={n} style={{ width: 6, height: 6, borderRadius: '50%', background: mc >= n ? '#a1c4fd' : 'rgba(255,255,255,0.3)', border: '1px solid', borderColor: mc >= n ? '#a1c4fd' : 'rgba(255,255,255,0.5)' }} />
            ))}
          </div>
        </div>
      );
    }
    return (
      <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
        {/* 已尝试 */}
        <button onClick={onToggleTried}
          style={{ display: 'flex', alignItems: 'center', gap: 7, background: cd.tried ? '#fff0f4' : '#f5f0f5', border: '1.5px solid', borderColor: cd.tried ? '#ffb8c4' : '#e8dce8', borderRadius: 20, padding: '7px 14px', cursor: 'pointer' }}>
          <div className="dot-btn" style={{ width: 13, height: 13, borderRadius: '50%', background: cd.tried ? '#ff9a9e' : 'transparent', border: '2px solid', borderColor: cd.tried ? '#ff9a9e' : '#c8b8c8' }} />
          <span style={{ fontSize: 12.5, color: cd.tried ? '#e07080' : '#b8a8b8', fontWeight: 600 }}>
            {cd.tried ? '已尝试 ✓' : '未尝试'}
          </span>
        </button>

        {/* 本月次数 */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, background: '#f0f4ff', border: '1.5px solid #d0dcff', borderRadius: 20, padding: '7px 14px' }}>
          <span style={{ fontSize: 12, color: '#8090c0', fontWeight: 600 }}>本月</span>
          <div style={{ display: 'flex', gap: 5 }}>
            {[1,2,3].map(n => (
              <button key={n} className="dot-btn" onClick={() => onSetMonthly(mc === n ? n - 1 : n)}
                style={{ width: 16, height: 16, borderRadius: '50%', border: '2px solid', borderColor: mc >= n ? '#7ab0ff' : '#c8d4ff', background: mc >= n ? '#7ab0ff' : 'transparent', cursor: 'pointer', padding: 0 }} />
            ))}
          </div>
          <span style={{ fontSize: 11, color: '#a0b0d8', minWidth: 20 }}>{mc}/3</span>
        </div>
      </div>
    );
  }

  // ─── Image Viewer ─────────────────────────────────────────────────────────
  function ImageViewer({ src, caption, onClose }) {
    const [scale, setScale] = useState(1);
    const [offset, setOffset] = useState({ x: 0, y: 0 });
    const lastDist = useRef(null);
    const lastMid = useRef(null);
    const startOffset = useRef(null);
    const lastTap = useRef(0);

    const getDist = (t) => {
      const dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
      return Math.sqrt(dx*dx + dy*dy);
    };
    const getMid = (t) => ({ x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 });

    const onTouchStart = (e) => {
      if (e.touches.length === 2) {
        lastDist.current = getDist(e.touches);
        lastMid.current = getMid(e.touches);
      } else if (e.touches.length === 1) {
        startOffset.current = { x: e.touches[0].clientX - offset.x, y: e.touches[0].clientY - offset.y };
        // double tap detection
        const now = Date.now();
        if (now - lastTap.current < 280) {
          setScale(s => { const ns = s > 1.5 ? 1 : 2.5; if (ns === 1) setOffset({ x: 0, y: 0 }); return ns; });
        }
        lastTap.current = now;
      }
    };

    const onTouchMove = (e) => {
      e.preventDefault();
      if (e.touches.length === 2) {
        const dist = getDist(e.touches);
        if (lastDist.current) {
          const ratio = dist / lastDist.current;
          setScale(s => Math.max(1, Math.min(6, s * ratio)));
        }
        lastDist.current = dist;
      } else if (e.touches.length === 1 && scale > 1 && startOffset.current) {
        setOffset({ x: e.touches[0].clientX - startOffset.current.x, y: e.touches[0].clientY - startOffset.current.y });
      }
    };

    const onTouchEnd = (e) => {
      lastDist.current = null;
      if (e.touches.length === 0 && scale <= 1) setOffset({ x: 0, y: 0 });
    };

    return (
      <div style={{ position: 'fixed', inset: 0, background: '#000', zIndex: 300, display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden' }}
        onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}>
        <img src={src} alt={caption}
          style={{ maxWidth: '100vw', maxHeight: '100vh', objectFit: 'contain', transform: `scale(${scale}) translate(${offset.x / scale}px, ${offset.y / scale}px)`, transformOrigin: 'center', touchAction: 'none', userSelect: 'none', display: 'block', transition: scale === 1 ? 'transform 0.2s' : 'none' }} />
        <button onClick={onClose}
          style={{ position: 'absolute', top: 54, right: 16, background: 'rgba(255,255,255,0.2)', border: 'none', borderRadius: '50%', width: 38, height: 38, color: '#fff', fontSize: 18, cursor: 'pointer', backdropFilter: 'blur(6px)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>✕</button>
        {caption && scale <= 1.2 && (
          <div style={{ position: 'absolute', bottom: 48, left: 0, right: 0, textAlign: 'center', color: 'rgba(255,255,255,0.85)', fontSize: 14, padding: '0 24px', textShadow: '0 1px 4px rgba(0,0,0,0.5)' }}>{caption}</div>
        )}
        <div style={{ position: 'absolute', bottom: 24, left: 0, right: 0, textAlign: 'center', color: 'rgba(255,255,255,0.4)', fontSize: 11 }}>双击或双指缩放</div>
      </div>
    );
  }

  // ─── Shared styles ────────────────────────────────────────────────────────
  const S = {
    page: { maxWidth: 480, margin: '0 auto', minHeight: '100vh', background: '#fdf6f9', position: 'relative' },
    backBtn: { background: 'rgba(255,255,255,0.55)', border: 'none', borderRadius: '50%', width: 38, height: 38, fontSize: 22, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 },
    pill: (primary) => ({
      flex: 1, padding: '13px 0', border: primary ? 'none' : '1.5px solid #ff9ab0',
      borderRadius: 14, fontWeight: 600, fontSize: 15, cursor: 'pointer',
      background: primary ? 'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)' : '#fff',
      color: primary ? '#fff' : '#ff9ab0',
      boxShadow: primary ? '0 3px 12px rgba(255,150,170,0.35)' : 'none',
    }),
    overlay: { position: 'fixed', inset: 0, background: 'rgba(20,0,10,0.55)', zIndex: 100, display: 'flex', alignItems: 'flex-end', backdropFilter: 'blur(2px)' },
    sheet: { background: '#fff', width: '100%', borderRadius: '22px 22px 0 0', padding: '0 20px 34px', maxHeight: '88vh', overflowY: 'auto' },
    handle: { width: 38, height: 4, background: '#e0d8e0', borderRadius: 2, margin: '12px auto 20px' },
    input: { width: '100%', border: '1.5px solid #f0e8f0', borderRadius: 14, padding: '13px 15px', fontSize: 15, outline: 'none', background: '#fdf6f9', color: '#333' },
    label: { fontSize: 12, color: '#b090b0', marginBottom: 8, fontWeight: 500, letterSpacing: 0.3 },
  };

  // ─── Home ─────────────────────────────────────────────────────────────────
  function HomeScreen() {
    const total = categories.reduce((s,c) => s + c.cards.length, 0);
    return (
      <div>
        <div style={{ background: 'linear-gradient(145deg, #ff9a9e 0%, #fad0c4 60%, #ffecd2 100%)', padding: '52px 20px 24px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
            <div>
              <div style={{ fontSize: 13, color: 'rgba(255,255,255,0.85)', fontWeight: 500, marginBottom: 4 }}>我的</div>
              <div style={{ fontSize: 28, fontWeight: 800, color: '#fff', letterSpacing: -0.5 }}>灵感册</div>
              <div style={{ fontSize: 12, color: 'rgba(255,255,255,0.75)', marginTop: 4 }}>{categories.length} 个分类 · {total} 张卡片</div>
            </div>
            <button onClick={() => setScreen('settings')}
              style={{ background: 'rgba(255,255,255,0.3)', border: 'none', borderRadius: '50%', width: 40, height: 40, fontSize: 18, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>⚙️</button>
          </div>
        </div>

  function ConfirmModal({ title, body, onConfirm, onCancel }) {
    return (
      <div style={{ position: 'fixed', inset: 0, background: 'rgba(20,0,10,0.55)', zIndex: 100, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24, backdropFilter: 'blur(2px)' }}>
        <div style={{ background: '#fff', borderRadius: 22, padding: '26px 22px 20px', width: '100%', maxWidth: 320, boxShadow: '0 8px 32px rgba(0,0,0,0.15)' }}>
          <div style={{ textAlign: 'center', fontSize: 16, fontWeight: 600, marginBottom: 8, color: '#2a2a2a' }}>{title}</div>
          {body && <div style={{ textAlign: 'center', fontSize: 13, color: '#b8a8b8', marginBottom: 20, lineHeight: 1.6 }}>{body}</div>}
          {!body && <div style={{ marginBottom: 20 }}></div>}
          <div style={{ display: 'flex', gap: 10 }}>
            <button onClick={onCancel} style={S.pill(false)}>取消</button>
            <button onClick={onConfirm} style={{ ...S.pill(true), background: 'linear-gradient(135deg, #ff6b6b, #ff9e9e)' }}>确认删除</button>
          </div>
        </div>
      </div>
    );
  }

  // ─── Root Render ──────────────────────────────────────────────────────────
  return (
    <div style={S.page}>
      {screen === 'home'     && <HomeScreen />}
      {screen === 'category' && <CategoryScreen />}
      {screen === 'card'     && <CardScreen />}
      {screen === 'settings' && <SettingsScreen />}

      {modal === 'addCard'    && <AddCardModal />}
      {modal === 'addCat'     && <AddCategoryModal />}
      {modal === 'random'     && <RandomModal />}
      {imgViewer && <ImageViewer src={imgViewer.src} caption={imgViewer.caption} onClose={() => setImgViewer(null)} />}
      {modal === 'deleteCard' && <ConfirmModal title="删除这张卡片？" onConfirm={deleteCard} onCancel={() => setModal(null)} />}
      {modal === 'deleteCat'  && <ConfirmModal title={`删除"${cat?.name}"？`} body="该分类下所有卡片也会一并删除，无法恢复。" onConfirm={deleteCategory} onCancel={() => setModal(null)} />}

      {toast && (
        <div style={{ position: 'fixed', bottom: 88, left: '50%', transform: 'translateX(-50%)', background: 'rgba(42,20,42,0.82)', color: '#fff', padding: '9px 22px', borderRadius: 22, fontSize: 14, zIndex: 9999, whiteSpace: 'nowrap', backdropFilter: 'blur(4px)' }}>
          {toast}
        </div>
      )}

      <input ref={fileInputRef} type="file" accept="image/*" style={{ display: 'none' }} onChange={handleImageUpload} />
      <input ref={importRef} type="file" accept=".json" style={{ display: 'none' }} onChange={handleImport} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
